<html lang="ja">
<head>
<meta charset="UTF-8">

<title>英単語れんしゅう</title>
<style>

  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 28px; text-align: center; color: #E07B39; margin: 12px 0 4px; }
  .sub { text-align: center; color: #999; font-size: 13px; margin-bottom: 16px; }
  .card { background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.08); margin-bottom: 16px; }
  .progress-label { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 8px; }
  .bar { background: #F0E6D6; border-radius: 999px; height: 22px; overflow: hidden; }
  .bar > div { background: linear-gradient(90deg, #FFB347, #E07B39); height: 100%; width: 0%; transition: width .4s; }
  .btn { display: block; width: 100%; border: none; border-radius: 16px; padding: 18px; font-size: 20px; font-weight: bold; cursor: pointer; margin-bottom: 12px; font-family: inherit; }
  .btn-main { background: #E07B39; color: #fff; }
  .btn-sub { background: #FFF0DC; color: #B35F1F; border: 2px solid #F2C894; }
  .btn-mode { background: #4FA8A0; color: #fff; }
  .btn:active { transform: scale(.98); }
  .filters { margin-bottom: 16px; }
  .filters .flabel { font-size: 14px; font-weight: bold; color: #888; margin: 10px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 2px solid #E8DCC8; background: #fff; border-radius: 999px; padding: 8px 14px; font-size: 15px; cursor: pointer; font-family: inherit; }
  .chip.on { background: #E07B39; border-color: #E07B39; color: #fff; font-weight: bold; }
  .pool-count { text-align: center; color: #888; font-size: 14px; margin: 8px 0 16px; }
  .hidden { display: none !important; }
  .back { background: none; border: none; font-size: 17px; color: #4FA8A0; font-weight: bold; cursor: pointer; margin-bottom: 12px; font-family: inherit; }
  .word-big { font-size: 44px; font-weight: bold; text-align: center; margin: 26px 0 6px; word-break: break-word; }
  .word-meta { text-align: center; color: #aaa; font-size: 15px; margin-bottom: 10px; }
  .stars { color: #E07B39; letter-spacing: 2px; }
  .tap-hint { text-align: center; color: #bbb; font-size: 15px; margin: 18px 0; }
  .meaning { font-size: 26px; font-weight: bold; text-align: center; margin: 14px 0; line-height: 1.5; }
  .example { background: #F4FAF9; border-radius: 12px; padding: 14px; font-size: 18px; line-height: 1.6; margin-top: 12px; }
  .example .ja { color: #666; font-size: 16px; }
  .para { background: #FFF6E8; border-radius: 12px; padding: 12px 14px; font-size: 17px; margin-top: 12px; }
  .para b { color: #B35F1F; }
  .warn { background: #FDECEC; border: 2px solid #F2A0A0; border-radius: 12px; padding: 12px 14px; font-size: 17px; margin-top: 12px; line-height: 1.6; }
  .warn b { color: #C0392B; }
  .judge-row { display: flex; gap: 12px; margin-top: 18px; }
  .judge-row .btn { margin-bottom: 0; }
  .btn-ok { background: #5CB85C; color: #fff; }
  .btn-ng { background: #F2A0A0; color: #7A2020; }
  .quiz-q { font-size: 34px; font-weight: bold; text-align: center; margin: 20px 0 6px; word-break: break-word; }
  .quiz-sentence { font-size: 22px; text-align: center; line-height: 1.7; margin: 20px 0 6px; }
  .choice { display: block; width: 100%; text-align: left; background: #fff; border: 3px solid #E8DCC8; border-radius: 14px; padding: 16px; font-size: 19px; margin-bottom: 10px; cursor: pointer; font-family: inherit; line-height: 1.4; }
  .choice.correct { border-color: #5CB85C; background: #EAF7EA; }
  .choice.wrong { border-color: #E57373; background: #FDECEC; }
  .feedback { font-size: 19px; text-align: center; margin: 14px 0; min-height: 28px; font-weight: bold; }
  .counter { text-align: center; color: #999; font-size: 15px; margin-bottom: 6px; }
  .done-msg { text-align: center; font-size: 22px; font-weight: bold; padding: 30px 0; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <!-- ホーム -->
  <div id="view-home">
    <h1>英単語れんしゅう</h1>
    <div class="sub">チェックがついた 174語</div>
    <div class="card">
      <div class="progress-label" id="progress-label">174語中 0語 おぼえた！</div>
      <div class="bar"><div id="progress-bar"></div></div>
      <div class="pool-count" id="progress-rest"></div>
    </div>
    <button class="btn btn-main" id="btn-today">☀️ 今日の分（8語）</button>
    <div class="filters">
      <div class="flabel">セクション</div>
      <div class="chips" id="chips-section"></div>
      <div class="flabel">★の数（まちがえた回数）</div>
      <div class="chips" id="chips-stars"></div>
      <div class="flabel">グループ</div>
      <div class="chips" id="chips-group"></div>
    </div>
    <div class="pool-count" id="pool-count"></div>
    <button class="btn btn-mode" id="btn-cards">🃏 カードで覚える</button>
    <button class="btn btn-sub" id="btn-quiz">❓ 意味あてクイズ</button>
    <button class="btn btn-sub" id="btn-exquiz">✏️ 例文クイズ</button>
  </div>

  <!-- カード -->
  <div id="view-card" class="hidden">
    <button class="back" data-go-home>← もどる</button>
    <div class="card">
      <div class="counter" id="card-counter"></div>
      <div class="word-big" id="card-word"></div>
      <div class="word-meta" id="card-meta"></div>
      <div id="card-front"><div class="tap-hint">タップすると 意味が出るよ</div></div>
      <div id="card-back" class="hidden">
        <div class="meaning" id="card-meaning"></div>
        <div id="card-extra"></div>
      </div>
      <div class="judge-row hidden" id="card-judge">
        <button class="btn btn-ok" id="btn-learned">おぼえた！😄</button>
        <button class="btn btn-ng" id="btn-still">まだ…😣</button>
      </div>
    </div>
  </div>

  <!-- クイズ -->
  <div id="view-quiz" class="hidden">
    <button class="back" data-go-home>← もどる</button>
    <div class="card">
      <div class="counter" id="quiz-counter"></div>
      <div id="quiz-question"></div>
      <div class="word-meta" id="quiz-meta"></div>
      <div id="quiz-choices"></div>
      <div class="feedback" id="quiz-feedback"></div>
      <div id="quiz-extra"></div>
      <button class="btn btn-main hidden" id="btn-quiz-next">つぎへ →</button>
    </div>
  </div>

  <!-- おわり -->
  <div id="view-done" class="hidden">
    <div class="card"><div class="done-msg" id="done-msg"></div></div>
    <button class="btn btn-main" data-go-home>トップへもどる</button>
  </div>
</div>

<script>
const LS_KEY = "tango-progress-v1";
let progress = {};
try { progress = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) { progress = {}; }
function saveProgress() { try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch (e) {} }
function isLearned(w) { return progress[w] === "learned"; }
function setState(w, s) { progress[w] = s; saveProgress(); renderProgress(); }

const filters = { section: 0, stars: 0, group: "all" };
function pool() {
  return WORDS.filter(d =>
    (filters.section === 0 || d.section === filters.section) &&
    (filters.stars === 0 || d.stars === filters.stars) &&
    (filters.group === "all" || d.group === filters.group || (filters.group === "second" && d.knownMeaning))
  );
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function renderProgress() {
  const n = WORDS.filter(d => isLearned(d.word)).length;
  document.getElementById("progress-label").textContent = WORDS.length + "語中 " + n + "語 おぼえた！";
  document.getElementById("progress-bar").style.width = (n / WORDS.length * 100) + "%";
  document.getElementById("progress-rest").textContent = "あと " + (WORDS.length - n) + "語";
  document.getElementById("pool-count").textContent = "いまの範囲：" + pool().length + "語";
}

function makeChips(elId, items, cur, cb) {
  const el = document.getElementById(elId);
  el.innerHTML = "";
  items.forEach(it => {
    const b = document.createElement("button");
    b.className = "chip" + (String(it.v) === String(cur) ? " on" : "");
    b.textContent = it.label;
    b.onclick = () => { cb(it.v); };
    el.appendChild(b);
  });
}
function renderChips() {
  makeChips("chips-section", [{v:0,label:"全部"},{v:1,label:"Section 1"},{v:2,label:"Section 2"},{v:3,label:"Section 3"}], filters.section, v => { filters.section = v; renderChips(); renderProgress(); });
  makeChips("chips-stars", [{v:0,label:"全部"},{v:3,label:"★★★"},{v:2,label:"★★"},{v:1,label:"★"}], filters.stars, v => { filters.stars = v; renderChips(); renderProgress(); });
  makeChips("chips-group", [{v:"all",label:"全部"},{v:"abstract",label:"抽象語"},{v:"society",label:"大人の社会"},{v:"connector",label:"つなぎ言葉"},{v:"second",label:"第2の意味"}], filters.group, v => { filters.group = v; renderChips(); renderProgress(); });
}

function show(view) {
  ["home","card","quiz","done"].forEach(v => document.getElementById("view-" + v).classList.toggle("hidden", v !== view));
  window.scrollTo(0, 0);
}
document.querySelectorAll("[data-go-home]").forEach(b => b.onclick = () => { renderProgress(); show("home"); });

function extraHtml(d) {
  let h = "";
  if (d.knownMeaning) h += '<div class="warn">⚠️ 「' + esc(d.knownMeaning) + '」とは <b>別の意味</b>！この本では「' + esc(d.meaning) + '」だよ</div>';
  if (d.example) h += '<div class="example">' + esc(d.example) + '<br><span class="ja">' + esc(d.exampleJa || "") + '</span></div>';
  if (d.paraphrase) h += '<div class="para">やさしい英語では：<b>' + esc(d.paraphrase) + '</b></div>';
  return h;
}
function metaText(d) { return "Section " + d.section + " ・ " + d.pos + ' ・ <span class="stars">' + "★".repeat(d.stars) + "</span>"; }

/* ---------- カード ---------- */
let deck = [], deckIdx = 0, deckLabel = "";
function startCards(list, label) {
  if (!list.length) { alert("この範囲の単語がありません"); return; }
  deck = list; deckIdx = 0; deckLabel = label || "";
  show("card"); renderCard();
}
function renderCard() {
  const d = deck[deckIdx];
  document.getElementById("card-counter").textContent = deckLabel + " " + (deckIdx + 1) + " / " + deck.length;
  document.getElementById("card-word").textContent = d.word;
  document.getElementById("card-meta").innerHTML = metaText(d);
  document.getElementById("card-front").classList.remove("hidden");
  document.getElementById("card-back").classList.add("hidden");
  document.getElementById("card-judge").classList.add("hidden");
  document.getElementById("card-meaning").textContent = d.meaning;
  document.getElementById("card-extra").innerHTML = extraHtml(d);
}
document.getElementById("view-card").querySelector(".card").addEventListener("click", e => {
  if (e.target.closest("button")) return;
  document.getElementById("card-front").classList.add("hidden");
  document.getElementById("card-back").classList.remove("hidden");
  document.getElementById("card-judge").classList.remove("hidden");
});
function nextCard() {
  deckIdx++;
  if (deckIdx >= deck.length) {
    document.getElementById("done-msg").innerHTML = "🎉 おつかれさま！<br>ぜんぶ見たよ";
    show("done");
  } else renderCard();
}
document.getElementById("btn-learned").onclick = () => { setState(deck[deckIdx].word, "learned"); nextCard(); };
document.getElementById("btn-still").onclick = () => { setState(deck[deckIdx].word, "still"); nextCard(); };

/* ---------- クイズ ---------- */
let quizList = [], quizIdx = 0, quizMode = "meaning", answered = false;
function forms(w) {
  const set = [w, w + "s", w + "es", w + "d", w + "ed", w + "ing"];
  if (w.endsWith("e")) set.push(w.slice(0, -1) + "ing");
  if (w.endsWith("y")) set.push(w.slice(0, -1) + "ies", w.slice(0, -1) + "ied");
  return set;
}
function blankExample(d) {
  const lower = d.example.toLowerCase();
  for (const f of forms(d.word)) {
    const i = lower.indexOf(f.toLowerCase());
    if (i >= 0) return d.example.slice(0, i) + "＿＿＿＿" + d.example.slice(i + f.length);
  }
  return null;
}
function startQuiz(mode) {
  let list = pool();
  if (mode === "example") list = list.filter(d => d.example && blankExample(d));
  if (list.length < 1) { alert("この範囲で出せる問題がありません"); return; }
  quizMode = mode;
  quizList = shuffle(list.filter(d => !isLearned(d.word)).concat(list.filter(d => isLearned(d.word)))).slice(0, 10);
  quizIdx = 0;
  show("quiz"); renderQuiz();
}
function renderQuiz() {
  answered = false;
  const d = quizList[quizIdx];
  document.getElementById("quiz-counter").textContent = (quizIdx + 1) + " / " + quizList.length + " 問";
  document.getElementById("quiz-meta").innerHTML = metaText(d);
  document.getElementById("quiz-feedback").textContent = "";
  document.getElementById("quiz-extra").innerHTML = "";
  document.getElementById("btn-quiz-next").classList.add("hidden");
  const q = document.getElementById("quiz-question");
  const ch = document.getElementById("quiz-choices");
  ch.innerHTML = "";
  let choices;
  if (quizMode === "meaning") {
    q.innerHTML = '<div class="quiz-q">' + esc(d.word) + '</div><div class="tap-hint">意味はどれ？</div>';
    let others = shuffle(WORDS.filter(x => x.word !== d.word && x.section === d.section));
    choices = shuffle([d].concat(others.slice(0, 3)));
    choices.forEach(c => {
      const b = document.createElement("button");
      b.className = "choice"; b.textContent = c.meaning;
      b.onclick = () => answer(b, c.word === d.word, d);
      ch.appendChild(b);
    });
  } else {
    q.innerHTML = '<div class="quiz-sentence">' + esc(blankExample(d)) + '</div><div class="tap-hint">あてはまる単語はどれ？</div>';
    let others = shuffle(WORDS.filter(x => x.word !== d.word && x.pos === d.pos));
    choices = shuffle([d].concat(others.slice(0, 3)));
    choices.forEach(c => {
      const b = document.createElement("button");
      b.className = "choice"; b.textContent = c.word;
      b.onclick = () => answer(b, c.word === d.word, d);
      ch.appendChild(b);
    });
  }
}
function answer(btn, ok, d) {
  if (answered) return;
  answered = true;
  document.querySelectorAll("#quiz-choices .choice").forEach(b => {
    const isAns = quizMode === "meaning" ? b.textContent === d.meaning : b.textContent === d.word;
    if (isAns) b.classList.add("correct");
  });
  if (!ok) btn.classList.add("wrong");
  document.getElementById("quiz-feedback").textContent = ok ? "⭕ せいかい！" : "❌ ざんねん… 正解は「" + (quizMode === "meaning" ? d.meaning : d.word) + "」";
  document.getElementById("quiz-feedback").style.color = ok ? "#3E8E41" : "#C0392B";
  document.getElementById("quiz-extra").innerHTML = extraHtml(d);
  setState(d.word, ok ? "learned" : "still");
  document.getElementById("btn-quiz-next").classList.remove("hidden");
}
document.getElementById("btn-quiz-next").onclick = () => {
  quizIdx++;
  if (quizIdx >= quizList.length) {
    const n = WORDS.filter(d => isLearned(d.word)).length;
    document.getElementById("done-msg").innerHTML = "🎉 クイズおわり！<br>おぼえた単語は " + n + "語になったよ";
    show("done");
  } else renderQuiz();
};

/* ---------- 起動 ---------- */
document.getElementById("btn-today").onclick = () => {
  const rest = shuffle(WORDS.filter(d => !isLearned(d.word)).sort((a, b) => b.stars - a.stars)).slice(0, 8);
  if (!rest.length) { document.getElementById("done-msg").innerHTML = "🏆 ぜんぶおぼえた！すごい！"; show("done"); return; }
  startCards(rest, "今日の分");
};
document.getElementById("btn-cards").onclick = () => {
  const p = pool();
  startCards(shuffle(p.filter(d => !isLearned(d.word))).concat(shuffle(p.filter(d => isLearned(d.word)))), "");
};
document.getElementById("btn-quiz").onclick = () => startQuiz("meaning");
document.getElementById("btn-exquiz").onclick = () => startQuiz("example");
renderChips();
renderProgress();
</script>
